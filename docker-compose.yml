version: '3.8'

services:

  # ── FastAPI prediction service ──
  app:
    build: .
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src          # live reload in dev
      - ./models:/app/models    # model artifacts
      # Mount AWS credentials for S3 prediction logging (optional, dev only)
      # - ~/.aws:/root/.aws:ro
    environment:
      - MODEL_PATH=/app/models/model.joblib
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      - prometheus
      - pushgateway
      - mlflow
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000 --reload

  # ── MLflow tracking server ──
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.10.1
    ports:
      - "5001:5000"
    volumes:
      - ./mlruns:/mlflow/mlruns      # run metadata (params, metrics) stays local
      # Mount AWS credentials for S3 artifact access (optional, dev only)
      # - ~/.aws:/root/.aws:ro
    environment:
      - AWS_DEFAULT_REGION
    command: >
      bash -c "pip install boto3 &&
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri /mlflow/mlruns
      --default-artifact-root ${MLFLOW_ARTIFACT_ROOT:-/mlflow/mlruns}"

  # ── Prometheus Pushgateway ──
  pushgateway:
    image: prom/pushgateway:latest
    ports:
      - "9091:9091"

  # ── Prometheus metrics scraper ──
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml

  # ── Grafana dashboard ──
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-admin}
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.gmail.com:587
      - GF_SMTP_USER=${GRAFANA_SMTP_USER}
      - GF_SMTP_PASSWORD=${GRAFANA_SMTP_PASSWORD}
      - GF_SMTP_FROM_ADDRESS=${GRAFANA_SMTP_USER}
      - GF_SMTP_FROM_NAME=MLOps Fraud Pipeline
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./docker/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

volumes:
  grafana-storage:
