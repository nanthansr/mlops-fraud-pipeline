<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Three lanes. Train: a Kaggle dataset of 284,807 transactions goes through XGBoost with scale_pos_weight 577 into an MLflow registry under a champion alias. Serve: a transaction hits FastAPI for schema validation, then the model held in memory, returning a score in 2 to 5 milliseconds; the registry promotes a new model without a redeploy. Watch: Evidently runs a scheduled drift check into a Pushgateway, Prometheus and Grafana rules read it alongside per-prediction counters from FastAPI, and an alert fires by email.">
<defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#6e7681"/></marker></defs>
